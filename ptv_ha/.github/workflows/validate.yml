name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install gtfs-realtime-bindings homeassistant

      - name: Check syntax
        run: |
          python -m py_compile custom_components/ptv/__init__.py
          python -m py_compile custom_components/ptv/binary_sensor.py
          python -m py_compile custom_components/ptv/config_flow.py
          python -m py_compile custom_components/ptv/const.py
          python -m py_compile custom_components/ptv/gtfs_static.py
          python -m py_compile custom_components/ptv/sensor.py
          echo "All files pass syntax check"

      - name: Validate manifest
        run: python -c "import json; json.load(open('custom_components/ptv/manifest.json')); print('manifest.json valid')"
