# ============================================================
# PTV Hurstbridge – Lovelace Dashboard Card
# ============================================================
# Paste this into your dashboard via Edit → Add Card → Manual
# Update station names below if yours differ from Ivanhoe.
# ============================================================

type: markdown
content: >
  ## Hurstbridge Line
  {% set level = states('sensor.ptv_hurstbridge_line_problem_level') %}
  {% if level == 'major' %}
  > 🚨 **Major disruption** — {{ states('sensor.ptv_hurstbridge_line_problem_summary') }}
  {% elif level == 'cancellations' %}
  > 🚫 **Cancellations** — {{ states('sensor.ptv_hurstbridge_line_problem_summary') }}
  {% elif level == 'alert' %}
  > ⚠️ **Alert** — {{ states('sensor.ptv_hurstbridge_line_alert') }}
  {% elif level == 'delays' %}
  > ⏱️ **Delays** — up to {{ states('sensor.ptv_hurstbridge_line_max_delay') }} min
  {% else %}
  > ✅ Running normally
  {% endif %}

  ---

  **Active trains:** {{ states('sensor.ptv_hurstbridge_line_active_trains') }} &nbsp;|&nbsp;
  **Occupancy:** {{ states('sensor.ptv_hurstbridge_line_occupancy') }}

  ---

  ### Ivanhoe → City
  | # | Time | Status |
  |---|------|--------|
  {% for i in [1,2,3,4] %}
  {% set s = 'sensor.ptv_hurstbridge_ivanhoe_citybound_' ~ i %}
  | {{ i }} | {{ state_attr(s, 'formatted') or 'Unknown' }} | {{ '🔴' if (state_attr(s, 'delay_minutes') | float(0)) > 2 else ('🟢' if state_attr(s, 'is_realtime') else '⚪') }} |
  {% endfor %}

  🟢 live &nbsp; ⚪ scheduled &nbsp; 🔴 delayed

  ### Ivanhoe → Hurstbridge
  | # | Time | Status |
  |---|------|--------|
  {% for i in [1,2,3,4] %}
  {% set s = 'sensor.ptv_hurstbridge_ivanhoe_outbound_' ~ i %}
  | {{ i }} | {{ state_attr(s, 'formatted') or 'Unknown' }} | {{ '🔴' if (state_attr(s, 'delay_minutes') | float(0)) > 2 else ('🟢' if state_attr(s, 'is_realtime') else '⚪') }} |
  {% endfor %}
