# ============================================================
# PTV Hurstbridge – Lovelace Dashboard Card
# ============================================================
# Paste this into your dashboard via Edit → Add Card → Manual
# Requires: custom:mushroom-template-card OR the built-in
# markdown card (both options provided below).
#
# OPTION A: Markdown card (no custom cards required)
# Works out of the box with standard Home Assistant.
# ============================================================

type: markdown
content: >
  ## Hurstbridge Line
  {% set level = states('sensor.ptv_hurstbridge_line_problem_level') %}
  {% if level == 'major' %}
  > 🚨 **Major disruption**
  {% elif level == 'cancellations' %}
  > 🚫 **Cancellations** — {{ states('sensor.ptv_hurstbridge_line_problem_summary') }}
  {% elif level == 'alert' %}
  > ⚠️ **Alert** — {{ states('sensor.ptv_hurstbridge_line_alert') }}
  {% elif level == 'delays' %}
  > ⏱️ **Delays** — up to {{ state_attr('sensor.ptv_hurstbridge_line_max_delay', 'unit_of_measurement') }}
  {% else %}
  > ✅ Running normally
  {% endif %}

  ---

  **Active trains:** {{ states('sensor.ptv_hurstbridge_line_active_trains') }} &nbsp;|&nbsp;
  **Occupancy:** {{ states('sensor.ptv_hurstbridge_line_occupancy') }}

  ---

  ### Ivanhoe → City
  | # | Time | Status |
  |---|------|--------|
  | 1 | {{ state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_1', 'formatted') }} | {{ '🔴' if state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_1', 'delay_minutes') | float > 2 else ('🟢' if state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_1', 'is_realtime') else '⚪') }} |
  | 2 | {{ state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_2', 'formatted') }} | {{ '🔴' if state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_2', 'delay_minutes') | float > 2 else ('🟢' if state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_2', 'is_realtime') else '⚪') }} |
  | 3 | {{ state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_3', 'formatted') }} | {{ '🔴' if state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_3', 'delay_minutes') | float > 2 else ('🟢' if state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_3', 'is_realtime') else '⚪') }} |
  | 4 | {{ state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_4', 'formatted') }} | {{ '🔴' if state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_4', 'delay_minutes') | float > 2 else ('🟢' if state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_4', 'is_realtime') else '⚪') }} |

