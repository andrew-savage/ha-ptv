blueprint:
  name: PTV Commute Notifications
  description: >
    Sends two daily notifications for your PTV commute:

    **Morning status** — fires at a set time with the overall line condition
    (on time, delays, alerts, cancellations) so you know what to expect
    before you leave the house.

    **Departure reminder** — fires closer to when you leave, listing the
    next 4 upcoming trains from your station so you can time your walk.

    Both notifications are sent to a mobile app notify service and include
    emoji status indicators. Only runs on selected weekdays.

    Planned overnight works are reported separately under a "🌙 Tonight"
    line, with the hours they actually run, rather than being treated as a
    disruption happening right now. Requires PTV integration 0.1.4 or newer.

    Besides the two scheduled times, any helper or entity can trigger a
    notification — an input_button on a dashboard, an input_boolean, or an
    alarm helper. Set "Also trigger on these entities" and choose what they
    send.

    To test without waiting, open the automation and choose "Run actions"
    (⋮ menu). That sends both notifications immediately using live data,
    and ignores the day filter.
  domain: automation
  source_url: https://github.com/andrew-savage/ha-ptv

  input:

    # ── Line ────────────────────────────────────────────────────────────────
    problem_level_sensor:
      name: Line Problem Level Sensor
      description: >
        e.g. sensor.ptv_hurstbridge_line_problem_level
        (state is one of: none / delays / alert / cancellations / major)
      selector:
        entity:
          domain: sensor

    problem_summary_sensor:
      name: Line Problem Summary Sensor
      description: >
        e.g. sensor.ptv_hurstbridge_line_problem_summary
        Plain English sentence describing the current situation.
      selector:
        entity:
          domain: sensor

    # ── Station departure sensors ────────────────────────────────────────────
    train_1:
      name: Next service (1st)
      description: e.g. sensor.ptv_hurstbridge_ivanhoe_citybound_1
      selector:
        entity:
          domain: sensor

    train_2:
      name: Next service (2nd)
      description: e.g. sensor.ptv_hurstbridge_ivanhoe_citybound_2
      selector:
        entity:
          domain: sensor

    train_3:
      name: Next service (3rd)
      description: e.g. sensor.ptv_hurstbridge_ivanhoe_citybound_3
      selector:
        entity:
          domain: sensor

    train_4:
      name: Next service (4th)
      description: e.g. sensor.ptv_hurstbridge_ivanhoe_citybound_4
      selector:
        entity:
          domain: sensor

    station_name:
      name: Station name
      description: Displayed in the departure notification title (e.g. Ivanhoe).
      default: My Station
      selector:
        text:

    # ── Service type ─────────────────────────────────────────────────────────
    service_type:
      name: Service type
      description: >
        Sets the wording and icons used in the notifications — "Next trams
        from Casino/Southbank" rather than "Next trains". Match this to the
        entities you selected above.
      default: train
      selector:
        select:
          options:
            - label: Train
              value: train
            - label: Tram
              value: tram
            - label: Bus
              value: bus

    # ── Extra triggers ───────────────────────────────────────────────────────
    trigger_entities:
      name: Also trigger on these entities
      description: >
        Optional. Any helper or entity that should also send the notification —
        an input_button pressed from a dashboard, an input_boolean switched on,
        or an alarm helper turning on. Fires when the entity turns on or is
        pressed, so leaving an input_boolean on will not re-trigger it.
      default: []
      selector:
        entity:
          multiple: true

    trigger_sends:
      name: What those entities send
      description: Which notification the entities above should send.
      default: departure_reminder
      selector:
        select:
          options:
            - label: Departure reminder (next services)
              value: departure_reminder
            - label: Line status
              value: morning_status
            - label: Both
              value: both

    # ── Overnight works ──────────────────────────────────────────────────────
    mention_overnight_works:
      name: Mention tonight's planned works
      description: >
        PTV publishes overnight works (e.g. "buses replace trains 11.50pm to
        last service") as active for the whole multi-day campaign, so they
        would otherwise be reported all day. When on, they appear as a
        separate "Tonight" line rather than as a current disruption. Turn off
        to leave them out of the notifications entirely.
      default: true
      selector:
        boolean:

    # ── Notify service ───────────────────────────────────────────────────────
    notify_service:
      name: Notify service
      description: >
        The mobile_app notify service for your phone,
        e.g. notify.mobile_app_andrews_iphone
      selector:
        text:

    # ── Morning status notification ──────────────────────────────────────────
    morning_time:
      name: Morning status time
      description: When to send the overall line status (e.g. 07:30).
      default: "07:30:00"
      selector:
        time:

    # ── Departure reminder notification ─────────────────────────────────────
    departure_time:
      name: Departure reminder time
      description: When to send the next-trains list (e.g. 07:50, just before you leave).
      default: "07:50:00"
      selector:
        time:

    # ── Days of week ─────────────────────────────────────────────────────────
    weekdays:
      name: Active days
      description: Which days to send notifications.
      default:
        - mon
        - tue
        - wed
        - thu
        - fri
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun

# ── Triggers ────────────────────────────────────────────────────────────────
trigger:
  - id: morning_status
    platform: time
    at: !input morning_time

  - id: departure_reminder
    platform: time
    at: !input departure_time

  - id: entity_trigger
    platform: state
    entity_id: !input trigger_entities
    not_to:
      - "off"
      - "unknown"
      - "unavailable"
    not_from:
      - "unknown"
      - "unavailable"

# ── Day filter ───────────────────────────────────────────────────────────────
condition:
  - condition: time
    weekday: !input weekdays

# ── Actions ─────────────────────────────────────────────────────────────────
variables:
  problem_level_sensor: !input problem_level_sensor
  problem_summary_sensor: !input problem_summary_sensor
  train_1: !input train_1
  train_2: !input train_2
  train_3: !input train_3
  train_4: !input train_4
  station_name: !input station_name
  notify_service: !input notify_service
  mention_overnight_works: !input mention_overnight_works
  trigger_sends: !input trigger_sends
  service_type: !input service_type
  vehicle_plural: >-
    {{ {'train': 'trains', 'tram': 'trams', 'bus': 'buses'}.get(service_type, 'services') }}
  vehicle_emoji: >-
    {{ {'train': '🚆', 'tram': '🚊', 'bus': '🚌'}.get(service_type, '🚆') }}
  line_word: >-
    {{ {'train': 'Line', 'tram': 'Route', 'bus': 'Route'}.get(service_type, 'Line') }}
  # problem_level already ignores works that haven't started, so the title
  # reflects the line's actual state right now.
  live_summary: >
    {{ state_attr(problem_summary_sensor, 'live_summary')
       or states(problem_summary_sensor) }}
  overnight_works: >
    {{ state_attr(problem_summary_sensor, 'overnight_works') or '' }}

action:
  - choose:

      # ── Morning status ────────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: >-
              {% set t = (trigger | default({})).get('id', '') %}
              {{ t in ['', 'morning_status']
                 or (t == 'entity_trigger'
                     and trigger_sends in ['both', 'morning_status']) }}
        sequence:
          - service: "{{ notify_service }}"
            data:
              title: >
                {% set level = states(problem_level_sensor) %}
                {% if level == 'major' %}🚨 Major Disruption
                {% elif level == 'cancellations' %}🚫 {{ vehicle_plural | capitalize }} Cancelled
                {% elif level == 'alert' %}⚠️ Service Alert
                {% elif level == 'delays' %}⏱️ Delays on Your {{ line_word }}
                {% else %}✅ Your {{ line_word }} is On Time
                {% endif %}
              message: >-
                {%- set parts = [live_summary] -%}
                {%- if mention_overnight_works and overnight_works -%}
                  {%- set parts = parts + ['', '🌙 Tonight: ' ~ overnight_works] -%}
                {%- endif -%}
                {{ parts | join('\n') }}

  - choose:

      # ── Departure reminder ────────────────────────────────────────────────
      - conditions:
          - condition: template
            value_template: >-
              {% set t = (trigger | default({})).get('id', '') %}
              {{ t in ['', 'departure_reminder']
                 or (t == 'entity_trigger'
                     and trigger_sends in ['both', 'departure_reminder']) }}
        sequence:
          - service: "{{ notify_service }}"
            data:
              title: >
                {% set level = states(problem_level_sensor) %}
                {% if level == 'major' %}🚨 Disruption – Next {{ vehicle_plural }} from {{ station_name }}
                {% elif level == 'cancellations' %}🚫 Cancellations – Next {{ vehicle_plural }} from {{ station_name }}
                {% elif level == 'alert' %}⚠️ Alert – Next {{ vehicle_plural }} from {{ station_name }}
                {% elif level == 'delays' %}⏱️ Delays – Next {{ vehicle_plural }} from {{ station_name }}
                {% else %}{{ vehicle_emoji }} Next {{ vehicle_plural }} from {{ station_name }}
                {% endif %}
              message: >-
                {%- set parts = [] -%}
                {%- if states(problem_level_sensor) != 'none' -%}
                  {%- set parts = parts + [live_summary, ''] -%}
                {%- endif -%}
                {%- set parts = parts + [
                     '1. ' ~ state_attr(train_1, 'formatted'),
                     '2. ' ~ state_attr(train_2, 'formatted'),
                     '3. ' ~ state_attr(train_3, 'formatted'),
                     '4. ' ~ state_attr(train_4, 'formatted')] -%}
                {%- if mention_overnight_works and overnight_works -%}
                  {%- set parts = parts + ['', '🌙 Tonight: ' ~ overnight_works] -%}
                {%- endif -%}
                {{ parts | join('\n') }}
              data:
                actions:
                  - action: URI
                    title: Open PTV App
                    uri: https://www.ptv.vic.gov.au
