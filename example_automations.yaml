# ============================================================
# PTV Hurstbridge – Morning Commute Automation
# ============================================================
# Entities used:
#
# binary_sensor.ptv_hurstbridge_line_any_problem   (on = something is wrong)
# sensor.ptv_hurstbridge_line_problem_level        (none/delays/alert/cancellations/major)
# sensor.ptv_hurstbridge_line_problem_summary      (TTS-ready sentence)
#
# Per-station upcoming trains (citybound = towards city):
#   sensor.ptv_hurstbridge_ivanhoe_citybound_1  through  _4
#   sensor.ptv_hurstbridge_ivanhoe_outbound_1   through  _4
#   sensor.ptv_hurstbridge_melbourne_central_citybound_1  etc.
#
# Each sensor's state is a timestamp. Useful attributes:
#   formatted      → "8:04 AM (on time)"  or  "8:04 AM (2 min late)"
#   delay_minutes  → float
#   is_realtime    → true/false
#   source         → "realtime" or "scheduled"
# ============================================================

automation:

  # ----------------------------------------------------------
  # 1. Morning commute briefing — fires at 7:45am weekdays
  #    Sends rich notification with problem summary + next 4 trains
  # ----------------------------------------------------------
  - alias: "Hurstbridge – Morning commute briefing"
    description: >
      At 7:45am on weekdays, sends a notification with the current
      line status and the next 4 citybound trains from Ivanhoe.
    trigger:
      - platform: time
        at: "07:45:00"
    condition:
      - condition: time
        weekday: [mon, tue, wed, thu, fri]
    action:
      - service: notify.mobile_app_your_phone
        data:
          title: >
            {% set level = states('sensor.ptv_hurstbridge_line_problem_level') %}
            {% if level == 'major' %}🚨 Major Disruption – Hurstbridge Line
            {% elif level == 'cancellations' %}🚫 Cancellations – Hurstbridge Line
            {% elif level == 'alert' %}⚠️ Service Alert – Hurstbridge Line
            {% elif level == 'delays' %}⏱️ Delays – Hurstbridge Line
            {% else %}✅ Hurstbridge Line – On Time
            {% endif %}
          message: >
            {{ states('sensor.ptv_hurstbridge_line_problem_summary') }}

            Next trains from Ivanhoe:
            1. {{ state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_1', 'formatted') }}
            2. {{ state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_2', 'formatted') }}
            3. {{ state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_3', 'formatted') }}
            4. {{ state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_4', 'formatted') }}
          data:
            # Android: adds action buttons
            actions:
              - action: "URI"
                title: "Open PTV App"
                uri: "https://www.ptv.vic.gov.au"

  # ----------------------------------------------------------
  # 2. Problem detected during commute window — immediate alert
  #    Fires any time a problem appears between 7am and 9:30am
  # ----------------------------------------------------------
  - alias: "Hurstbridge – Commute window problem alert"
    description: >
      Sends an immediate alert when a problem is detected
      during the morning commute window.
    trigger:
      - platform: state
        entity_id: binary_sensor.ptv_hurstbridge_line_any_problem
        to: "on"
    condition:
      - condition: time
        after: "07:00:00"
        before: "09:30:00"
      - condition: time
        weekday: [mon, tue, wed, thu, fri]
    action:
      - service: notify.mobile_app_your_phone
        data:
          title: >
            {% set level = states('sensor.ptv_hurstbridge_line_problem_level') %}
            {% if level == 'major' %}🚨 Major Disruption
            {% elif level == 'cancellations' %}🚫 Train Cancelled
            {% elif level == 'alert' %}⚠️ Service Alert
            {% else %}⏱️ Delays Detected
            {% endif %}
          message: >
            {{ states('sensor.ptv_hurstbridge_line_problem_summary') }}

            Next available trains from Ivanhoe:
            1. {{ state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_1', 'formatted') }}
            2. {{ state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_2', 'formatted') }}

  # ----------------------------------------------------------
  # 3. All clear after a problem
  # ----------------------------------------------------------
  - alias: "Hurstbridge – All clear"
    trigger:
      - platform: state
        entity_id: binary_sensor.ptv_hurstbridge_line_any_problem
        to: "off"
        for: "00:05:00"
    condition:
      - condition: time
        after: "07:00:00"
        before: "20:00:00"
      - condition: time
        weekday: [mon, tue, wed, thu, fri]
    action:
      - service: notify.mobile_app_your_phone
        data:
          title: "✅ Hurstbridge Line Cleared"
          message: >
            {{ states('sensor.ptv_hurstbridge_line_problem_summary') }}
            Next citybound from Ivanhoe: {{ state_attr('sensor.ptv_hurstbridge_ivanhoe_citybound_1', 'formatted') }}

  # ----------------------------------------------------------
  # 4. Evening departure reminder at 5:30pm
  # ----------------------------------------------------------
  - alias: "Hurstbridge – Evening departure reminder"
    trigger:
      - platform: time
        at: "17:30:00"
    condition:
      - condition: time
        weekday: [mon, tue, wed, thu, fri]
    action:
      - service: notify.mobile_app_your_phone
        data:
          title: "🚆 Next Trains from Melbourne Central"
          message: >
            {% set level = states('sensor.ptv_hurstbridge_line_problem_level') %}
            {% if level != 'none' %}
            ⚠️ {{ states('sensor.ptv_hurstbridge_line_problem_summary') }}
            {% endif %}
            1. {{ state_attr('sensor.ptv_hurstbridge_melbourne_central_outbound_1', 'formatted') }}
            2. {{ state_attr('sensor.ptv_hurstbridge_melbourne_central_outbound_2', 'formatted') }}
            3. {{ state_attr('sensor.ptv_hurstbridge_melbourne_central_outbound_3', 'formatted') }}
            4. {{ state_attr('sensor.ptv_hurstbridge_melbourne_central_outbound_4', 'formatted') }}

  # ----------------------------------------------------------
  # 5. Smart light (green/yellow/red)
  # ----------------------------------------------------------
  - alias: "Hurstbridge – Indicator light"
    trigger:
      - platform: state
        entity_id: sensor.ptv_hurstbridge_line_problem_level
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.ptv_hurstbridge_line_problem_level
                state: "none"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.your_indicator_light
                data: {color_name: green, brightness_pct: 60}
          - conditions:
              - condition: state
                entity_id: sensor.ptv_hurstbridge_line_problem_level
                state: "delays"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.your_indicator_light
                data: {color_name: yellow, brightness_pct: 80}
        default:
          - service: light.turn_on
            target:
              entity_id: light.your_indicator_light
            data: {color_name: red, brightness_pct: 100}
